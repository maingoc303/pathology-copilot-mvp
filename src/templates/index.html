<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathology Co-Pilot MVP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background: #0f111a; color: #e2e8f0; overflow: hidden; }
        
        #leftPanel { width: 55%; height: 100%; border-right: 1px solid #2d3748; display: flex; flex-direction: column; position: relative; }
        #osdContainer { width: 100%; flex-grow: 1; background: #1a202c; position: relative; }
        #osdViewer { width: 100%; height: 100%; }
        
        /* Mac-style Selection Crosshair overlay overlaying the viewer */
        #selectionOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: none; cursor: crosshair;
        }
        .roi-drag-box {
            position: absolute; border: 2px dashed #00e6ff; background: rgba(0, 230, 255, 0.15);
            box-shadow: 0 0 8px rgba(0,230,255,0.5); pointer-events: none;
        }

        #toolbar { padding: 12px; background: #1a1d24; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #2d3748; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .preset-badge { background: #2b6cb0; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .preset-badge:hover { background: #3182ce; }
        .url-input { background: #2d3748; border: 1px solid #4a5568; padding: 6px 12px; border-radius: 4px; color: white; font-size: 0.85rem; flex-grow: 1; }
        .action-btn { background: #4a5568; color: white; padding: 6px 12px; border-radius: 4px; border: none; font-size: 0.85rem; cursor: pointer; }
        .action-btn:hover { background: #718096; }
        
        /* Visual Helper Badge */
        #modeIndicator { position: absolute; top: 15px; left: 15px; z-index: 20; padding: 6px 12px; background: rgba(15,17,26,0.85); border: 1px solid #4a5568; border-radius: 20px; font-size: 0.8rem; pointer-events: none; display: none; align-items: center; gap: 6px; }
        
        #rightPanel { width: 45%; height: 100%; display: flex; flex-direction: column; background: #12141c; }
        #chatHistory { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .user-msg { background: #2d3748; align-self: flex-end; color: #fff; }
        .ai-msg { background: #1e2230; align-self: flex-start; border-left: 4px solid #3182ce; }
        #inputArea { padding: 15px; background: #1a1d24; border-top: 1px solid #2d3748; display: flex; gap: 10px; }
        #userInput { flex-grow: 1; background: #2d3748; border: none; border-radius: 6px; padding: 12px; color: white; font-size: 0.95rem; }
        #sendBtn { padding: 12px 20px; background: #3182ce; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .roi-preview { max-width: 180px; border: 2px solid #00e6ff; border-radius: 4px; margin-top: 8px; display: block; }
    </style>
</head>
<body>

    <div id="leftPanel">
        <div id="toolbar">
            <div class="row">
                <span style="font-size: 0.85rem; color: #a0aec0; font-weight: bold;">Presets:</span>
                <span class="preset-badge" onclick="loadHESlide('https://upload.wikimedia.org/wikipedia/commons/4/43/Infiltrating_ductal_carcinoma_of_the_breast_histopathology_%282%29.jpg', 'TCGA-BRCA')">Breast H&E</span>
                <span class="preset-badge" onclick="loadHESlide('https://upload.wikimedia.org/wikipedia/commons/d/da/Adenocarcinoma_of_lung_histopathology_%281%29.jpg', 'TCGA-LUAD')">Lung H&E</span>
            </div>
            <div class="row">
                <input type="text" id="customUrlInput" class="url-input" placeholder="Paste custom image URL here...">
                <button class="action-btn" onclick="loadCustomUrl()">Load URL</button>
                <input type="file" id="localFileUploader" accept="image/*" style="display: none;" onchange="loadLocalFile(event)">
                <button class="action-btn" style="background: #2b6cb0;" onclick="document.getElementById('localFileUploader').click()">📁 Upload H&E</button>
            </div>
        </div>
        
        <div id="osdContainer">
            <div id="modeIndicator">🎯 <span style="color:#00e6ff; font-weight:bold;">Ctrl + Drag Mode:</span> Draw your ROI box</div>
            <div id="osdViewer"></div>
            <div id="selectionOverlay"></div>
        </div>
    </div>

    <div id="rightPanel">
        <div id="chatHistory">
            <div class="message ai-msg">
                <strong>Interactive Canvas Ready:</strong><br>
                • Use mouse wheel to pan/zoom tissue sections layout maps.<br>
                • <strong>Hold down the [ Ctrl ] key and drag your mouse</strong> directly across any structural cell cluster to select a target crop area (Mac Ctrl+4 style)!
            </div>
        </div>
        <div id="inputArea">
            <input type="text" id="userInput" placeholder="Ask a diagnostic question about this area...">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let viewer = null;
        let activeImageUrl = "";
        let currentROI = null;

        // Selection Engine Coordinates
        let isDrawing = false;
        let startX = 0, startY = 0;
        let dragBox = null;

        function initViewer(url) {
            activeImageUrl = url;
            document.getElementById('modeIndicator').style.display = 'flex';
            
            if (viewer) { viewer.destroy(); }

            viewer = OpenSeadragon({
                id: "osdViewer",
                prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
                tileSources: { type: 'image', url: url },
                showNavigationControl: false,
                crossOriginPolicy: 'Anonymous'
            });

            setupCaptureEngine();
        }

        function loadHESlide(url, caseId) {
            initViewer(url);
            document.getElementById('userInput').value = `Evaluating specimen slice parameters for ${caseId}. Describe structural patterns seen here.`;
        }

        function loadCustomUrl() {
            const url = document.getElementById('customUrlInput').value.trim();
            if (!url) return;
            initViewer(url);
            document.getElementById('userInput').value = `Evaluating pathology features from remote image asset channel. Describe any cellular anomalies.`;
        }

        function loadLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const blobUrl = URL.createObjectURL(file);
            initViewer(blobUrl);
            activeImageUrl = "local-device-upload";
            document.getElementById('userInput').value = `Analyzing local H&E upload (${file.name}). Provide a morphology assessment.`;
        }

        // --- THE MAC OS-STYLE SCREEN CAPTURE ENGINE ---
        function setupCaptureEngine() {
            const container = document.getElementById('osdContainer');
            const overlay = document.getElementById('selectionOverlay');

            // Listen to standard window tracker flags for holding down 'Ctrl'
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Control') {
                    overlay.style.display = 'block';
                    if(viewer) viewer.setMouseNavEnabled(false); // Freezes pan/zoom so mouse can crop safely
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'Control') {
                    overlay.style.display = 'none';
                    if(viewer) viewer.setMouseNavEnabled(true);
                }
            });

            // Handle Drag Boundaries inside Viewport
            container.addEventListener('mousedown', (e) => {
                if (!e.ctrlKey || !viewer) return;
                isDrawing = true;
                
                const rect = container.getBoundingClientRect();
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;

                dragBox = document.createElement('div');
                dragBox.className = 'roi-drag-box';
                dragBox.style.left = startX + 'px';
                dragBox.style.top = startY + 'px';
                container.appendChild(dragBox);
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDrawing || !dragBox) return;
                const rect = container.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                const width = currentX - startX;
                const height = currentY - startY;

                dragBox.style.width = Math.abs(width) + 'px';
                dragBox.style.height = Math.abs(height) + 'px';
                dragBox.style.left = (width > 0 ? startX : currentX) + 'px';
                dragBox.style.top = (height > 0 ? startY : currentY) + 'px';
            });

            container.addEventListener('mouseup', (e) => {
                if (!isDrawing) return;
                isDrawing = false;

                // Process precise geometric crop matrix via invisible spatial memory layer
                processCrop(dragBox.getBoundingClientRect(), container.getBoundingClientRect());

                if (dragBox) {
                    dragBox.remove();
                    dragBox = null;
                }
            });
        }

        function processCrop(boxRect, containerRect) {
            if (!viewer || !viewer.drawer || !viewer.drawer.canvas) return;

            const canvas = viewer.drawer.canvas;
            
            // Calculate pixel scale offset between HTML display size and actual rendering engine dimensions
            const scaleX = canvas.width / containerRect.width;
            const scaleY = canvas.height / containerRect.height;

            const cropX = (boxRect.left - containerRect.left) * scaleX;
            const cropY = (boxRect.top - containerRect.top) * scaleY;
            const cropW = boxRect.width * scaleX;
            const cropH = boxRect.height * scaleY;

            // Protection against tiny click hallucinations
            if (cropW < 10 || cropH < 10) return;

            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = 240;
            outputCanvas.height = 180;
            const outputContext = outputCanvas.getContext('2d');

            // Draw the exact segment box selection onto the payload stream
            outputContext.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, 240, 180);
            currentROI = outputCanvas.toDataURL('image/jpeg', 0.9);

            const history = document.getElementById('chatHistory');
            history.innerHTML += `
                <div class="message user-msg" style="background:#00b4cc; color:#12141c; font-weight:500;">
                    <strong>[ROI Region Selected]</strong> Staged explicit target view coordinates into memory stream:
                    <img class="roi-preview" src="${currentROI}" />
                </div>`;
            history.scrollTop = history.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const query = inputField.value.trim();
            if (!query) return;

            const history = document.getElementById('chatHistory');
            history.innerHTML += `<div class="message user-msg">${query}</div>`;
            inputField.value = '';
            history.scrollTop = history.scrollHeight;

            try {
                const response = await fetch('/api/v1/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        case_id: "CASE-" + Math.floor(Math.random() * 10000),
                        clinical_history: query,
                        image_metadata: { 
                            stain: "H&E", 
                            image_url: activeImageUrl,
                            roi_snapshot: currentROI 
                        }
                    })
                });
                
                const data = await response.json();
                let aiResponse = "";
                
                if (data.status === "success") {
                    let rawText = data.model_output[0]?.generated_text || "";
                    rawText = rawText.replace(/\*\*(.*?)\*\"/g, '<strong>$1</strong>');
                    rawText = rawText.replace(/\n\n/g, '</p><p style="margin-top: 8px;">');
                    rawText = rawText.replace(/\n/g, '<br>');
                    aiResponse = `<p>${rawText}</p>`;
                } else {
                    aiResponse = `<strong>System Alert:</strong> ${data.detail || JSON.stringify(data)}`;
                }

                history.innerHTML += `<div class="message ai-msg">${aiResponse}</div>`;
                currentROI = null; 
            } catch (err) {
                history.innerHTML += `<div class="message ai-msg"><strong>Error:</strong> Network tracking failure.</div>`;
            }
            history.scrollTop = history.scrollHeight;
        }
    </script>
</body>
</html>
